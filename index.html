<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MilBra">
<link rel="manifest" href="manifest.webmanifest">
<title>MilBra 3.0</title>
<style>
:root{--bg:#0b0d10;--panel:#15191f;--line:#292f37;--text:#f5f7fa;--muted:#87909e;--white:#f4f6f8}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}
header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top)}
.icon{width:40px;height:40px;border:0;background:transparent;color:#fff;font-size:23px}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:12px;background:var(--white);color:#0b0d10;display:grid;place-items:center;font-size:20px;font-weight:900}.title{font-weight:800}.sub{font-size:10px;color:var(--muted);margin-top:2px}.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:5px}.status.on{background:#32d074}
main{flex:1;overflow:auto;padding:20px 14px 145px}.wrap{max-width:780px;margin:auto}.hero{text-align:center;padding:45px 10px 28px}.hero .big{width:76px;height:76px;border-radius:25px;background:var(--white);color:#0b0d10;margin:0 auto 20px;display:grid;place-items:center;font-size:34px;font-weight:900}.hero h1{font-size:31px;margin:0 0 10px}.hero p{color:var(--muted);line-height:1.5;max-width:430px;margin:auto}.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:580px;margin:25px auto}.chip{background:#13171c;border:1px solid var(--line);color:#fff;border-radius:18px;padding:15px;text-align:left}
.msg{margin:18px 0 26px}.meta{display:flex;align-items:center;gap:9px;margin-bottom:8px}.avatar{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px}.ai{background:var(--white);color:#0b0d10}.userav{background:#2b3139}.name{font-size:13px;font-weight:700}.text{padding-left:38px;font-size:16px;line-height:1.55;white-space:pre-wrap}.error{color:#ff8d8d}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:24px 11px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0d10 34%)}.composer{max-width:780px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:29px;display:flex;align-items:flex-end;padding:7px;gap:5px}.plus,.mic{border:0;background:transparent;color:#ddd;width:42px;height:42px;border-radius:50%;font-size:21px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;min-height:42px;max-height:130px;padding:10px 3px;font-size:16px}.send{border:0;width:42px;height:42px;border-radius:50%;background:var(--white);color:#0b0d10;font-size:22px;font-weight:900}.send:disabled{opacity:.25}.foot{text-align:center;color:#656e7b;font-size:10px;margin-top:8px}
.panel{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:10;display:none}.panel.open{display:block}.side{width:min(88vw,350px);height:100%;background:#111419;padding:22px 14px}.side h2{margin:5px 5px 18px}.btn{width:100%;border:1px solid var(--line);background:#171b21;color:white;border-radius:14px;padding:13px;text-align:left;margin-bottom:9px}.hist{padding:10px 8px;border-radius:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hist.active{background:#1b2027}
@media(max-width:520px){.chips{grid-template-columns:1fr}.hero{padding-top:35px}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header>
<button class="icon" id="menu">☰</button>
<div class="brand"><div class="logo">✦</div><div><div class="title">MilBra</div><div class="sub"><span id="dot" class="status"></span><span id="statusText">verificando cérebro...</span></div></div></div>
<button class="icon" id="new">＋</button>
</header>
<main id="main"><div class="wrap">
<section class="hero" id="hero">
<div class="big">✦</div><h1>MilBra 3.0</h1>
<p>Agora preparado para conversar com uma IA de verdade.</p>
<div class="chips">
<button class="chip">📚 Me ajude a estudar</button>
<button class="chip">🧠 Explique algo difícil</button>
<button class="chip">🎮 Crie um jogo comigo</button>
<button class="chip">🚀 Me dê uma ideia incrível</button>
</div>
</section>
<div id="chat"></div>
</div></main>
<div class="bottom"><div class="composer">
<button class="plus">＋</button>
<textarea id="input" rows="1" placeholder="Mensagem para o MilBra"></textarea>
<button class="mic" id="mic">🎙</button>
<button class="send" id="send" disabled>↑</button>
</div><div class="foot">MilBra pode cometer erros. Confira informações importantes.</div></div>
</div>
<div class="panel" id="panel"><div class="side"><h2>MilBra</h2><button class="btn" id="new2">＋ Nova conversa</button><div id="history"></div></div></div>
<script>
const $=x=>document.getElementById(x), chat=$('chat'), input=$('input'), send=$('send'), main=$('main'), hero=$('hero');
let data=JSON.parse(localStorage.getItem('milbra3')||'null')||{conversations:[],current:null,name:'Marco',personality:'amigável'};
function save(){localStorage.setItem('milbra3',JSON.stringify(data));history()}
function cur(){return data.conversations.find(c=>c.id===data.current)}
function fresh(){const c={id:Date.now(),title:'Nova conversa',messages:[]};data.conversations.unshift(c);data.current=c.id;save();render();$('panel').classList.remove('open')}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function row(m,extra=''){const d=document.createElement('div');d.className='msg';d.innerHTML=`<div class="meta"><div class="avatar ${m.role==='assistant'?'ai':'userav'}">${m.role==='assistant'?'✦':'M'}</div><div class="name">${m.role==='assistant'?'MilBra':'Você'}</div></div><div class="text ${extra}">${esc(m.text)}</div>`;chat.appendChild(d);return d}
function render(){chat.innerHTML='';const ms=cur()?.messages||[];hero.style.display=ms.length?'none':'block';ms.forEach(m=>row(m));setTimeout(()=>main.scrollTop=main.scrollHeight,20)}
function history(){$('history').innerHTML='';data.conversations.forEach(c=>{const e=document.createElement('div');e.className='hist '+(c.id===data.current?'active':'');e.textContent=c.title;e.onclick=()=>{data.current=c.id;save();render();$('panel').classList.remove('open')};$('history').appendChild(e)})}
async function ask(text){
 if(!text.trim())return;if(!cur())fresh();const c=cur();c.messages.push({role:'user',text:text.trim()});if(c.title==='Nova conversa')c.title=text.trim().slice(0,35);input.value='';send.disabled=true;save();render();
 const thinking=row({role:'assistant',text:'Pensando…'});main.scrollTop=main.scrollHeight;
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages,name:data.name,personality:data.personality})});
  const j=await r.json();thinking.remove();
  if(!r.ok)throw new Error(j.error||'Erro ao conversar com a IA.');
  c.messages.push({role:'assistant',text:j.reply});save();render();
 }catch(e){thinking.remove();row({role:'assistant',text:e.message},'error');}
}
input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';send.disabled=!input.value.trim()}
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}}
send.onclick=()=>ask(input.value);
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent.replace(/^.. /,'')));
$('menu').onclick=()=>$('panel').classList.add('open');$('panel').onclick=e=>{if(e.target===$('panel'))$('panel').classList.remove('open')};$('new').onclick=fresh;$('new2').onclick=fresh;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const r=new SR();r.lang='pt-BR';r.onresult=e=>{input.value=e.results[0][0].transcript;input.oninput()};$('mic').onclick=()=>r.start()}else $('mic').onclick=()=>alert('Ditado por voz não está disponível neste navegador.');
fetch('/api/status').then(r=>r.json()).then(s=>{if(s.brainConnected){$('dot').classList.add('on');$('statusText').textContent='cérebro conectado'}else $('statusText').textContent='aguardando chave da IA'}).catch(()=>{$('statusText').textContent='abra pelo servidor do MilBra'});
if(!data.conversations.length)fresh();else{if(!data.current)data.current=data.conversations[0].id;history();render()}
</script>
</body></html>
